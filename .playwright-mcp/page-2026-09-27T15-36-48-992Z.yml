    - paragraph [ref=f5e438]: Yatırım hizmet ve faaliyetleri, Sermaye Piyasası Kurulu tarafından yetkilendirilen, lisanslı Midas Menkul Değerler A.Ş. aracılığıyla sunulmaktadır. Bu sayfada yer alan fiyatlar yalnızca bilgi sunulması amacıyla hazırlanmış olup Midas Menkul Değerler A.Ş. tarafından Borsa İstanbul A.Ş. Pay Piyasası Emtia Pazarı’nda işlem gören, Darphane tarafından ihraç edilen Altın sertifikası (Altın.S1) haricinde altın alım satım hizmeti sunulmamaktadır. Serbest Piyasa Altın verileri en az 15 dakika gecikmeli verilerdir. Burada yer alan bilgi, yorum ve tavsiyeler yatırım danışmanlığı kapsamında değil sadece genel niteliktedir. Bu tavsiyeler mali durumunuz ile risk ve getiri tercihlerinize uygun olmayabilir. Bu nedenle, sadece burada yer alan bilgilere dayanılarak yatırım kararı verilmesi beklentilerinize uygun sonuçlar doğurmayabilir. Finansal veriler Foreks A.Ş. tarafından sağlanmaktadır. Midas, yayınlanan verilerin doğruluğu ve tamlığı konusunda herhangi bir garanti vermez. Hesaplamalarda kullanılan verilerin ve hesaplanan değişkenlerin doğruluğu garanti edilemez. Yapılacak filtremeler sonucu ulaşılacak sonuçlar herhangi bir yatırım aracının alım-satım önerisi ya da getiri vaadi olarak yorumlanmamalıdır. Bu sonuçlara dayanarak yatırım kararı verilmesi beklentilerinize uygun sonuçlar doğurmayabilir. Hesaplamalarda veya teknoloji farklılıkları nedeni ile ortaya çıkabilecek hatalardan, veri yayınında oluşabilecek aksaklıklardan, verinin eksik ve yanlış yayınlanmasından meydana gelebilecek herhangi bir zarardan Midas sorumlu değildir.
